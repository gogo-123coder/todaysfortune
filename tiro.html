<script>
// ============================================================
// ⭐ Cloudflare Worker 網址（部署後填入！）
//    沒填空字串 = 即時報價自動關閉，其他功能不受影響（仍可看到 FinMind 收盤資料）
// ============================================================
const WORKER_URL = ''; // 例如：'https://stock-worker.your-name.workers.dev'

// ============================================================
// 設定 — 使用 FinMind API（台灣專屬、原生支援 CORS、不需 proxy）
// ============================================================
const FINMIND_BASE = 'https://api.finmindtrade.com/api/v4/data';
const NAME_CACHE_KEY = 'taiwan_stock_info_v2'; // 含中文名、行業、上市/上櫃

// 圖表自訂插件：表格點擊時，在圖上畫一條垂直藍線並標日期
const verticalLinePlugin = {
  id: 'verticalLine',
  afterDraw: (chart) => {
    const cfg = chart.options.plugins?.verticalLine;
    if (!cfg || cfg.x == null) return;
    const xPx = chart.scales.x.getPixelForValue(cfg.x);
    if (xPx < chart.chartArea.left || xPx > chart.chartArea.right) return;
    const ctx = chart.ctx;
    ctx.save();
    ctx.beginPath();
    ctx.setLineDash([5, 3]);
    ctx.moveTo(xPx, chart.chartArea.top);
    ctx.lineTo(xPx, chart.chartArea.bottom);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#2563eb';
    ctx.stroke();
    ctx.restore();
    // 日期標籤
    const d = new Date(cfg.x);
    const label = `${d.getMonth()+1}/${d.getDate()}`;
    ctx.save();
    ctx.fillStyle = '#2563eb';
    ctx.fillRect(xPx - 22, chart.chartArea.top - 16, 44, 14);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, xPx, chart.chartArea.top - 5);
    ctx.restore();
  }
};
Chart.register(verticalLinePlugin);

// ============================================================
// 工具：localStorage 釘選
// ============================================================
const PIN_KEY = 'taiwan_stock_pins_v1';
const getPins = () => {
  try { return JSON.parse(localStorage.getItem(PIN_KEY)) || []; }
  catch { return []; }
};
const setPins = (arr) => localStorage.setItem(PIN_KEY, JSON.stringify(arr));
const isPinned = (code) => getPins().includes(code);
const togglePin = (code) => {
  const pins = getPins();
  const idx = pins.indexOf(code);
  if (idx >= 0) pins.splice(idx, 1);
  else pins.push(code);
  setPins(pins);
  return pins.includes(code);
};

// ============================================================
// 抓資料：FinMind 日 K
// ============================================================
async function fetchPriceData(code) {
  // 抓 9 個月資料（為了讓 MA60 與其他指標有足夠樣本）
  const start = new Date();
  start.setMonth(start.getMonth() - 9);
  const startStr = start.toISOString().slice(0, 10);
  const url = `${FINMIND_BASE}?dataset=TaiwanStockPrice&data_id=${encodeURIComponent(code)}&start_date=${startStr}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json.status !== 200) throw new Error(json.msg || 'API 回傳錯誤');
  if (!json.data || json.data.length === 0) {
    throw new Error('找不到此股票代號的歷史資料，請確認代號正確');
  }
  return json.data;
}

// 取得股票中文名稱（一天快取一次）
let nameMapPromise = null;
async function loadNameMap() {
  if (nameMapPromise) return nameMapPromise;
  nameMapPromise = (async () => {
    try {
      const today = new Date().toISOString().slice(0, 10);
      const cached = JSON.parse(localStorage.getItem(NAME_CACHE_KEY) || 'null');
      if (cached && cached.date === today && cached.map) return cached.map;
    } catch {}
    try {
      const res = await fetch(`${FINMIND_BASE}?dataset=TaiwanStockInfo`);
      const json = await res.json();
      const map = {};
      if (json.data) {
        json.data.forEach(d => {
          if (d.stock_id) map[d.stock_id] = {
            name: d.stock_name || d.stock_id,
            industry: d.industry_category || '',
            type: d.type || '' // twse=上市, tpex=上櫃
          };
        });
      }
      try {
        localStorage.setItem(NAME_CACHE_KEY, JSON.stringify({
          date: new Date().toISOString().slice(0, 10),
          map
        }));
      } catch {}
      return map;
    } catch {
      return {};
    }
  })();
  return nameMapPromise;
}

async function getStockName(code) {
  const map = await loadNameMap();
  return map[code]?.name || code;
}

async function getStockInfo(code) {
  const map = await loadNameMap();
  return map[code] || { name: code, industry: '', type: '' };
}

// ============================================================
// 即時報價（Cloudflare Worker → TWSE MIS）
// ============================================================
let liveTimer = null;

async function fetchLiveQuote(code) {
  if (!WORKER_URL) return null;
  try {
    const r = await fetch(`${WORKER_URL}/api/quote?code=${encodeURIComponent(code)}`);
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

function applyLiveQuote(data) {
  if (!data || data.price == null) return;
  const priceEl  = document.getElementById('livePrice');
  const changeEl = document.getElementById('liveChange');
  const timeEl   = document.getElementById('liveTime');
  if (!priceEl || !changeEl) return;
  const chg = data.change ?? 0;
  const pct = data.change_pct ?? 0;
  const sign = chg > 0 ? '▲' : chg < 0 ? '▼' : '–';
  const cls  = chg > 0 ? 'signal-bull' : chg < 0 ? 'signal-bear' : 'signal-neutral';
  priceEl.className  = priceEl.className.replace(/signal-(bull|bear|neutral)/g, '').trim() + ' ' + cls;
  changeEl.className = changeEl.className.replace(/signal-(bull|bear|neutral)/g, '').trim() + ' ' + cls;
  priceEl.textContent  = data.price.toFixed(2);
  changeEl.textContent = `${sign} ${Math.abs(chg).toFixed(2)} (${Math.abs(pct).toFixed(2)}%)`;
  if (timeEl) {
    const status = data.is_trading ? '即時' : '盤後';
    timeEl.innerHTML = `<span class="inline-block w-2 h-2 ${data.is_trading ? 'bg-red-500 animate-pulse' : 'bg-slate-400'} rounded-full mr-1 align-middle"></span>📡 ${status} ${data.time || ''}`;
  }
}

async function startLiveUpdates(code) {
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  if (!WORKER_URL) return;
  const tick = async () => {
    const data = await fetchLiveQuote(code);
    if (data) applyLiveQuote(data);
  };
  await tick();
  liveTimer = setInterval(tick, 30000); // 30 秒刷一次
}

// ============================================================
// 消息面：抓 Google 新聞 + 關鍵字情緒分析
// ============================================================
const NEWS_POS = ['大漲','上漲','漲停','漲幅','利多','強勢','突破','新高','創高','看好','加碼','獲利','成長','增加','業績','訂單','大單','升評','調升','大賺','亮眼','超預期','受惠','拉抬','轉強','轉好','旺季','飆','登頂','爆量','看俏'];
const NEWS_NEG = ['大跌','下跌','跌停','跌幅','利空','弱勢','跌破','新低','創低','看壞','減碼','虧損','衰退','減少','滑落','放緩','警訊','降評','調降','賣壓','失利','衝擊','低於','不如預期','受挫','拉回','轉弱','淡季','慘','重摔','跳水','看淡','疲軟'];

function newsSentiment(title) {
  let pos = 0, neg = 0;
  NEWS_POS.forEach(w => { if (title.includes(w)) pos++; });
  NEWS_NEG.forEach(w => { if (title.includes(w)) neg++; });
  const score = pos - neg;
  if (score > 0)  return { tag: '利多', score, cls: 'bg-red-100 text-red-700' };
  if (score < 0)  return { tag: '利空', score, cls: 'bg-green-100 text-green-700' };
  return { tag: '中性', score: 0, cls: 'bg-slate-100 text-slate-500' };
}

function splitTitleSource(rawTitle) {
  const idx = rawTitle.lastIndexOf(' - ');
  if (idx > 0) return { title: rawTitle.slice(0, idx), source: rawTitle.slice(idx + 3) };
  return { title: rawTitle, source: '' };
}

function relativeTime(pubDateStr) {
  if (!pubDateStr) return '';
  const date = new Date(pubDateStr.includes('T') ? pubDateStr : pubDateStr.replace(' ', 'T') + 'Z');
  const diff = (Date.now() - date.getTime()) / 1000;
  if (diff < 60) return '剛剛';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分鐘前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小時前';
  if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' 天前';
  return date.toLocaleDateString('zh-TW');
}

async function fetchNews(query, count = 10) {
  const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(query)}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`;
  const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&count=${count}`;
  const res = await fetch(apiUrl);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json.status !== 'ok') throw new Error(json.message || 'RSS error');
  return json.items || [];
}

async function renderNewsSection(query, containerId) {
  const box = document.getElementById(containerId);
  if (!box) return;
  box.innerHTML = '<div class="text-sm text-slate-500 text-center py-6"><span class="loader inline-block align-middle mr-2"></span>抓取最新消息…</div>';
  try {
    const items = await fetchNews(query, 10);
    if (!items.length) {
      box.innerHTML = '<p class="text-sm text-slate-500 text-center py-4">查無相關新聞</p>';
      return;
    }
    let totalScore = 0;
    const list = items.map(item => {
      const { title, source } = splitTitleSource(item.title || '');
      const s = newsSentiment(item.title || '');
      totalScore += s.score;
      const safeTitle = title.replace(/</g, '&lt;');
      return `
        <a href="${item.link}" target="_blank" rel="noopener noreferrer"
           class="block p-3 hover:bg-slate-50 transition border-b border-slate-100 last:border-b-0">
          <div class="flex items-start gap-2">
            <span class="px-2 py-0.5 ${s.cls} rounded text-[10px] font-bold whitespace-nowrap shrink-0 mt-0.5">${s.tag}</span>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-slate-800 leading-snug">${safeTitle}</div>
              <div class="text-xs text-slate-400 mt-1">
                ${source ? `<span class="font-bold text-slate-500">${source}</span> · ` : ''}<span>${relativeTime(item.pubDate)}</span>
              </div>
            </div>
          </div>
        </a>
      `;
    }).join('');

    const overall = totalScore > 1 ? { tag: '整體偏正面', emoji: '🔴', cls: 'bg-rose-50 border-rose-200 text-rose-700' }
                  : totalScore < -1 ? { tag: '整體偏負面', emoji: '🟢', cls: 'bg-emerald-50 border-emerald-200 text-emerald-700' }
                  : { tag: '好壞都有，還不確定', emoji: '🟡', cls: 'bg-amber-50 border-amber-200 text-amber-700' };

    box.innerHTML = `
      <div class="border rounded-xl p-3 mb-3 ${overall.cls}">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xl">${overall.emoji}</span>
          <span class="font-black">最近的新聞感覺：${overall.tag}</span>
          <span class="text-xs opacity-75">（總分 ${totalScore >= 0 ? '+' : ''}${totalScore}・依標題關鍵字粗略判斷，僅供參考）</span>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-slate-100 overflow-hidden">${list}</div>
      <p class="text-xs text-slate-400 mt-2 text-center">來源：Google 新聞・點任一則開新分頁查看原文</p>
    `;
  } catch (err) {
    box.innerHTML = `<p class="text-sm text-red-500 text-center py-4">新聞抓取失敗（${err.message}），稍後再試</p>`;
  }
}

// ============================================================
// 指標計算
// ============================================================
function sma(arr, n) {
  const out = new Array(arr.length).fill(null);
  let sum = 0;
  for (let i = 0; i < arr.length; i++) {
    sum += arr[i];
    if (i >= n) sum -= arr[i - n];
    if (i >= n - 1) out[i] = sum / n;
  }
  return out;
}

function calcKD(highs, lows, closes, n = 9) {
  const k = new Array(closes.length).fill(50);
  const d = new Array(closes.length).fill(50);
  for (let i = 0; i < closes.length; i++) {
    if (i < n - 1) continue;
    let hh = -Infinity, ll = Infinity;
    for (let j = i - n + 1; j <= i; j++) {
      if (highs[j] > hh) hh = highs[j];
      if (lows[j] < ll) ll = lows[j];
    }
    const rsv = hh === ll ? 50 : ((closes[i] - ll) / (hh - ll)) * 100;
    k[i] = (k[i - 1] !== undefined ? k[i - 1] : 50) * 2 / 3 + rsv / 3;
    d[i] = (d[i - 1] !== undefined ? d[i - 1] : 50) * 2 / 3 + k[i] / 3;
  }
  return { k, d };
}

function calcRSI(closes, n = 14) {
  const out = new Array(closes.length).fill(null);
  if (closes.length <= n) return out;
  let gain = 0, loss = 0;
  for (let i = 1; i <= n; i++) {
    const diff = closes[i] - closes[i - 1];
    if (diff >= 0) gain += diff; else loss -= diff;
  }
  let avgGain = gain / n, avgLoss = loss / n;
  out[n] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  for (let i = n + 1; i < closes.length; i++) {
    const diff = closes[i] - closes[i - 1];
    const g = diff > 0 ? diff : 0;
    const l = diff < 0 ? -diff : 0;
    avgGain = (avgGain * (n - 1) + g) / n;
    avgLoss = (avgLoss * (n - 1) + l) / n;
    out[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  }
  return out;
}

function detectCross(maShort, maLong, lookback = 3) {
  const last = maShort.length - 1;
  for (let i = last; i >= last - lookback && i > 0; i--) {
    if (maShort[i] == null || maLong[i] == null || maShort[i - 1] == null || maLong[i - 1] == null) continue;
    if (maShort[i - 1] <= maLong[i - 1] && maShort[i] > maLong[i]) return { type: 'golden', daysAgo: last - i };
    if (maShort[i - 1] >= maLong[i - 1] && maShort[i] < maLong[i]) return { type: 'death', daysAgo: last - i };
  }
  return null;
}


// ============================================================
// 綜合判斷
// ============================================================
function analyze(closes, highs, lows) {
  const ma5 = sma(closes, 5);
  const ma20 = sma(closes, 20);
  const ma60 = sma(closes, 60);
  const { k, d } = calcKD(highs, lows, closes);
  const rsi = calcRSI(closes);
  const last = closes.length - 1;

  const close = closes[last];
  const ma5v = ma5[last], ma20v = ma20[last], ma60v = ma60[last];
  const kv = k[last], dv = d[last], rsiv = rsi[last];

  // 計分
  let score = 0;
  const reasons = [];
  if (ma20v != null) {
    if (close > ma20v) { score++; reasons.push('股價站在近期平均價之上，走勢偏強'); }
    else { score--; reasons.push('股價跌到近期平均價之下，走勢偏弱'); }
  }
  if (ma5v != null && ma20v != null) {
    if (ma5v > ma20v) { score++; reasons.push('短期走勢比長期走勢還強，動能向上'); }
    else { score--; reasons.push('短期走勢比長期走勢還弱，動能向下'); }
  }
  if (ma20v != null && ma60v != null) {
    if (ma20v > ma60v) { score++; }
    else { score--; }
  }
  if (kv != null && dv != null) {
    if (kv > dv) { score++; reasons.push('買盤力道強過賣盤（短期偏強）'); }
    else { score--; reasons.push('賣盤力道強過買盤（短期偏弱）'); }
  }

  // 超買超賣
  let zone = 'neutral', zoneText = '合理區', zoneHint = '';
  if (rsiv != null && rsiv > 70) { zone = 'overbought'; zoneText = '漲過頭了'; zoneHint = 'RSI 偏高，最近漲太多，可能快要回跌，現在買要小心'; score--; }
  else if (rsiv != null && rsiv < 30) { zone = 'oversold'; zoneText = '跌過頭了'; zoneHint = 'RSI 偏低，已經跌很深，可能快有反彈機會'; score++; }
  else if (kv != null && kv > 80) { zone = 'overbought'; zoneText = '漲過頭了'; zoneHint = 'KD 偏高，短線漲得有點過頭了'; score--; }
  else if (kv != null && kv < 20) { zone = 'oversold'; zoneText = '跌過頭了'; zoneHint = 'KD 偏低，短線跌得有點過頭了'; score++; }
  else { zoneHint = '漲跌幅度在正常範圍內，沒有過熱或過冷的問題'; }

  // 黃金 / 死亡交叉
  const cross = detectCross(ma5, ma20);
  if (cross) {
    if (cross.type === 'golden') { score += 2; reasons.unshift(`${cross.daysAgo === 0 ? '收盤當天' : cross.daysAgo + ' 天前'}出現黃金交叉（短期均線穿越長期均線往上，好訊號）`); }
    else { score -= 2; reasons.unshift(`${cross.daysAgo === 0 ? '收盤當天' : cross.daysAgo + ' 天前'}出現死亡交叉（短期均線穿越長期均線往下，警示訊號）`); }
  }

  // 結論
  let trend = 'neutral', trendText = '橫盤整理', trendEmoji = '🟡';
  if (score >= 3) { trend = 'bull'; trendText = '短期偏漲'; trendEmoji = '🔴'; }
  else if (score <= -3) { trend = 'bear'; trendText = '短期偏跌'; trendEmoji = '🟢'; }

  // 一句話建議
  let oneLine;
  if (trend === 'bull' && zone === 'overbought') oneLine = '走勢往上，但最近漲太快，現在追買可能買在高點，要小心';
  else if (trend === 'bull' && zone === 'oversold') oneLine = '跌很深又出現反彈跡象，是值得留意的機會';
  else if (trend === 'bull') oneLine = '短期走勢往上，整體感覺偏樂觀';
  else if (trend === 'bear' && zone === 'oversold') oneLine = '已經跌了很多，但大方向還是往下，先觀望比較安全';
  else if (trend === 'bear' && zone === 'overbought') oneLine = '有小幅反彈，但整體還是往下，要小心隨時被賣方壓下來';
  else if (trend === 'bear') oneLine = '短期走勢往下，整體感覺偏悲觀';
  else if (zone === 'overbought') oneLine = '股價沒有明確方向，但位置偏高，現在買要小心';
  else if (zone === 'oversold') oneLine = '股價沒有明確方向，但跌得比較深，可留意有沒有反彈';
  else oneLine = '股價在原地打轉，還沒看出方向，先等等觀察';

  return {
    close, ma5: ma5v, ma20: ma20v, ma60: ma60v, k: kv, d: dv, rsi: rsiv,
    cross, score, trend, trendText, trendEmoji, zone, zoneText, zoneHint,
    oneLine, reasons,
    ma5Arr: ma5, ma20Arr: ma20, ma60Arr: ma60,
    kArr: k, dArr: d, rsiArr: rsi
  };
}

// ============================================================
// 投資建議：根據 trend + zone + cross 給出明確的可買 / 可賣
// ============================================================
function getAction(a) {
  const recentGolden = a.cross && a.cross.type === 'golden' && a.cross.daysAgo <= 5;
  const recentDeath  = a.cross && a.cross.type === 'death'  && a.cross.daysAgo <= 5;

  // 強烈買進
  if (a.trend === 'bull' && a.zone === 'oversold')
    return { tag: '可以考慮買進', emoji: '🟢', tone: 'buy', strong: true,
      advice: '跌深後出現反彈訊號，感覺是相對便宜的買進時機，但還是要評估自己的預算和能承受多少虧損。' };
  if (a.trend === 'bull' && recentGolden)
    return { tag: '可以考慮買進', emoji: '🟢', tone: 'buy', strong: true,
      advice: '剛出現黃金交叉而且走勢往上，感覺從弱轉強，可以分批慢慢買。' };

  // 一般買進
  if (a.trend === 'bull' && a.zone !== 'overbought')
    return { tag: '看起來可以買', emoji: '🟢', tone: 'buy', strong: false,
      advice: '走勢向上，而且沒有漲過頭，可以跟著趨勢操作，不過如果跌破 20 天平均價格就要重新評估。' };

  // 過熱
  if (a.trend === 'bull' && a.zone === 'overbought')
    return { tag: '現在追買太危險', emoji: '🟠', tone: 'caution', strong: false,
      advice: '雖然走勢往上，但漲太多太快了，現在追買風險很高；已經持有的可以繼續持有，還沒買的等股價跌回來再說。' };

  // 強烈賣出
  if (a.trend === 'bear' && recentDeath)
    return { tag: '建議減少持股或避開', emoji: '🔴', tone: 'sell', strong: true,
      advice: '剛出現死亡交叉而且走勢往下，感覺從強轉弱，如果你手上有這支股票可以考慮減少。' };
  if (a.trend === 'bear' && a.zone === 'overbought')
    return { tag: '考慮先賣出', emoji: '🔴', tone: 'sell', strong: false,
      advice: '反彈到偏高的位置，但整體走勢還是往下，感覺可以趁這個機會先出場。' };

  // 觀望反彈
  if (a.trend === 'bear' && a.zone === 'oversold')
    return { tag: '先等等，別衝動', emoji: '🟡', tone: 'hold', strong: false,
      advice: '已經跌很多，但大方向還是往下，等看到連幾天止跌（例如出現紅 K 棒且量縮）再考慮要不要買。' };

  // 純偏空
  if (a.trend === 'bear')
    return { tag: '現在不適合買', emoji: '🔴', tone: 'sell', strong: false,
      advice: '整體走勢向下，暫時避開比較安全，等出現明確止跌訊號再說。' };

  // 中性 + 過熱
  if (a.zone === 'overbought')
    return { tag: '現在追買太危險', emoji: '🟠', tone: 'caution', strong: false,
      advice: '股價沒有明確方向，但位置偏高，追買容易買在高點後下跌。' };

  // 中性 + 超賣
  if (a.zone === 'oversold')
    return { tag: '可以留意有無反彈', emoji: '🟡', tone: 'hold', strong: false,
      advice: '股價跌得比較深，可能會有反彈機會，但因為沒有明確方向，不要一次押太多錢。' };

  // 純中性
  return { tag: '先觀望就好', emoji: '🟡', tone: 'hold', strong: false,
    advice: '漲跌訊號都有，還看不出明確方向，等確認方向再行動是最穩妥的做法。' };
}

// ============================================================
// 完整交易計畫：自動計算關鍵價位、量比、進出場條件
// ============================================================
function findKeyLevels(closes, highs, lows) {
  const N = closes.length;
  const cur = closes[N - 1];
  const win = (arr, n) => arr.slice(Math.max(0, N - n));
  const max = arr => Math.max(...arr);
  const min = arr => Math.min(...arr);
  const round2 = v => Math.round(v * 100) / 100;

  const recent20H = max(win(highs, 20));
  const recent60H = max(win(highs, 60));
  const recent20L = min(win(lows, 20));
  const recent60L = min(win(lows, 60));
  const allTimeL  = min(lows);

  // 壓力位（要在現價之上）
  const r1 = recent20H > cur ? recent20H : round2(cur * 1.05);
  const r2 = recent60H > r1 ? recent60H : round2(r1 * 1.06);
  // 支撐位（要在現價之下）
  const s1 = recent20L < cur ? recent20L : round2(cur * 0.95);
  const s2 = recent60L < s1 ? recent60L : round2(s1 * 0.94);
  const strongS = allTimeL < s2 ? allTimeL : round2(s2 * 0.92);

  return {
    breakout: round2(cur), r1: round2(r1), r2: round2(r2),
    s1: round2(s1), s2: round2(s2), strongS: round2(strongS),
  };
}

// 進場合理價格：依趨勢計算 2-3 個價格區間
function calcEntryZones(analysis, levels) {
  const a = analysis;
  const L = levels;
  const cur = a.close;
  const ma20 = a.ma20;
  const zones = [];

  const round2 = v => Math.round(v * 100) / 100;

  if (a.trend === 'bull') {
    // 保守區：靠近支撐 / MA20（首選）
    const baseLow = ma20 != null ? Math.min(L.s1, ma20) : L.s1;
    const baseHigh = ma20 != null ? Math.max(L.s1, ma20) : L.s1 * 1.03;
    zones.push({
      level: 'good',
      name: '穩健買點',
      tag: '✅ 首選',
      from: round2(baseLow),
      to: round2(baseHigh),
      rationale: `等股價跌回第一道防線（${fmt(L.s1)}）附近再買，勝算比較高；萬一繼續往下跌破第一道防線，就要賣出`,
    });

    // 順勢區：現價附近（非過熱時）
    if (a.zone !== 'overbought') {
      zones.push({
        level: 'aggressive',
        name: '跟著走勢買',
        tag: '⚠️ 積極型',
        from: round2(cur * 0.98),
        to: round2(cur * 1.01),
        rationale: `接近目前收盤價買入，跟著上漲走，但如果跌破第一道防線（${fmt(L.s1)}）就要果斷賣出，不能捨不得`,
      });
    }

    // 不宜區：壓力以上
    if (cur < L.r2) {
      zones.push({
        level: 'avoid',
        name: '這個價位太貴了',
        tag: '⛔ 避開',
        from: round2(Math.max(cur, L.r1) * 1.05),
        to: round2(L.r2),
        rationale: '這區間已經偏高，這時候買很容易一買就跌，建議等股價跌下來再說',
      });
    }
  } else if (a.trend === 'bear') {
    zones.push({
      level: 'avoid',
      name: '現在先別買',
      tag: '⛔ 不宜',
      from: null, to: null,
      rationale: '整體走勢往下，不建議現在買。等看到連幾天止跌（例如出現紅 K 棒、成交量變少）再評估',
    });
    if (a.zone === 'oversold') {
      zones.push({
        level: 'aggressive',
        name: '超跌反彈區（高風險，新手少碰）',
        tag: '⚠️ 高風險',
        from: round2(L.strongS),
        to: round2(L.s1),
        rationale: `跌很深可能會短暫反彈，如果真的要試，只能放一小部分的錢，而且跌破強力底部價（${fmt(L.strongS)}）就要立刻賣出，不能猶豫`,
      });
    }
  } else {
    // 盤整：高低區間操作
    zones.push({
      level: 'good',
      name: '低點買進區',
      tag: '✅ 區間下緣',
      from: round2(L.s1),
      to: round2(L.s1 * 1.03),
      rationale: `在區間低點分批慢慢買，如果跌破第一道防線（${fmt(L.s1)}）就要賣出，不要繼續撐著`,
    });
    zones.push({
      level: 'avoid',
      name: '高點考慮賣出區',
      tag: '📤 區間上緣',
      from: round2(L.r1 * 0.97),
      to: round2(L.r1),
      rationale: `接近第一道關卡（${fmt(L.r1)}）可以考慮分批賣出，不要等到最高點才賣`,
    });
  }

  return zones;
}

function calcVolRatio(volumes) {
  const N = volumes.length;
  if (N < 6) return null;
  const today = volumes[N - 1] || 0;
  const last5 = volumes.slice(N - 6, N - 1);
  const avg = last5.reduce((a, b) => a + b, 0) / 5;
  if (!avg) return null;
  return { today, avg, ratio: (today / avg - 1) * 100 };
}

  return `

            </div>

            <div>

            <div>

              <div class="font-black text-base text-rose-400">${fmt(price)}</div>

            <div>

              <div class="font-black ${chgCls}">${chgSign} ${Math.abs(chg).toFixed(2)} <span class="text-[10px]">(${Math.abs(chgPct).toFixed(2)}%)</span></div>
            </div>
            <div>
              <div class="text-slate-500">整體走勢</div>
              <div class="font-black ${trendBadgeCls}">${a.trendText}</div>

            <div>

              <div class="font-black ${volRatioCls}">${volRatioStr}</div>

        </div>
      </div>

      <!-- Panels Grid -->
      <div class="p-3 sm:p-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        ${panel('1', '目前走勢', ul(trendBullets))}
        ${panel('2', '重要價格區間', `<div class="space-y-1.5 text-xs">${keyLevels}</div>`)}
        ${panel('3', '建議買進的價格範圍', `<div class="space-y-2">${entryZonesHtml}</div>`, 'cyan')}
        ${panel('4', '操作策略', strategy)}
        ${panel('5', '🛡️ 風險控制（超重要！）', ul([

// ============================================================
// 渲染：股票卡片
// ============================================================
let chartInstance = null;

function fmt(v, d = 2) { return v == null || isNaN(v) ? '—' : Number(v).toFixed(d); }

function renderResult(code, meta, timestamps, opens, highs, lows, closes, volumes, analysis) {
  const a = analysis;
  const name = meta.longName || meta.shortName || code;
  const price = meta.regularMarketPrice ?? closes[closes.length - 1];
  const prev = meta.chartPreviousClose ?? meta.previousClose ?? closes[closes.length - 2];
  const chg = price - prev;
  const chgPct = prev ? (chg / prev) * 100 : 0;
  const chgClass = chg >= 0 ? 'signal-bull' : 'signal-bear';
  const chgSign = chg >= 0 ? '▲' : '▼';

  const trendBg = a.trend === 'bull' ? 'bg-bull' : a.trend === 'bear' ? 'bg-bear' : 'bg-neutral';
  const trendCls = a.trend === 'bull' ? 'signal-bull' : a.trend === 'bear' ? 'signal-bear' : 'signal-neutral';

  const zoneBadge = a.zone === 'overbought' ? '<span class="px-2 py-0.5 bg-red-100 text-red-700 rounded text-xs font-bold">漲過頭了</span>'
    : a.zone === 'oversold' ? '<span class="px-2 py-0.5 bg-green-100 text-green-700 rounded text-xs font-bold">跌過頭了</span>'
    : '<span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-xs font-bold">漲跌正常</span>';

  const pinned = isPinned(code);
  const pinIcon = pinned ? '⭐ 已追蹤' : '☆ 追蹤';

  const html = `
    <div class="fade-in space-y-4">
      <!-- Main card -->
      <div class="${trendBg} rounded-2xl shadow-md p-5 sm:p-6">
        <div class="flex items-start justify-between flex-wrap gap-3 mb-4">
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <h2 class="text-2xl font-black text-slate-800">${name}</h2>
              <span class="text-slate-500 text-sm font-mono">${code}</span>
              ${zoneBadge}
            </div>
            <div class="flex items-baseline gap-3 mt-1 flex-wrap">
              <span id="livePrice" class="text-3xl font-black ${chgClass}">${fmt(price)}</span>
              <span id="liveChange" class="text-base font-bold ${chgClass}">${chgSign} ${fmt(Math.abs(chg))} (${fmt(Math.abs(chgPct))}%)</span>
              <span id="liveTime" class="text-xs text-slate-500 ml-1"></span>
            </div>
          </div>
          <div class="flex gap-2">
            <button id="pinBtn" class="px-3 py-2 bg-white/70 hover:bg-white rounded-lg text-sm font-bold border border-white">${pinIcon}</button>
            <button id="shareBtn" class="px-3 py-2 bg-white/70 hover:bg-white rounded-lg text-sm font-bold border border-white">🔗 複製連結</button>
          </div>
        </div>

        <!-- 一句話結論 -->
        <div class="bg-white/70 rounded-xl p-4 mb-3">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-2xl">${a.trendEmoji}</span>
            <span class="text-lg font-black ${trendCls}">${a.trendText}</span>
          </div>
          <p class="text-slate-700 font-medium">${a.oneLine}</p>
          <p class="text-xs text-slate-500 mt-2">${a.zoneHint}</p>
        </div>

        <!-- 投資建議 -->
        ${(() => {
          const act = getAction(a);
          const bg = act.tone === 'buy' ? 'bg-rose-50 border-rose-200'
                  : act.tone === 'sell' ? 'bg-emerald-50 border-emerald-200'
                  : act.tone === 'caution' ? 'bg-orange-50 border-orange-200'
                  : 'bg-amber-50 border-amber-200';
          const tagBg = act.tone === 'buy' ? 'bg-rose-500' : act.tone === 'sell' ? 'bg-emerald-500' : act.tone === 'caution' ? 'bg-orange-500' : 'bg-amber-500';
          const star = act.strong ? '<span class="text-xs font-bold text-yellow-600 ml-1">★ 強力訊號</span>' : '';
          return `<div class="rounded-xl p-4 border-2 ${bg}">
            <div class="flex items-center gap-2 mb-2 flex-wrap">
              <span class="text-xs font-bold text-slate-500">📌 操作建議</span>
              <span class="${tagBg} text-white text-sm font-black px-3 py-1 rounded-full">${act.emoji} ${act.tag}</span>
              ${star}
            </div>
            <p class="text-sm text-slate-700">${act.advice}</p>
          </div>`;
        })()}
      </div>

      <!-- 完整交易計畫 (專業版) -->
      ${buildTradingPlan(code, name, meta.market, meta.industry, a, { closes, highs, lows, volumes }, meta.lastDate, meta.previousClose)}

      <!-- 消息面 / 時事 -->
      <div class="bg-white rounded-2xl shadow-sm p-4 sm:p-5">
        <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
          <h3 class="text-sm font-bold text-slate-600">📰 最新相關新聞</h3>
          <button id="refreshNews" class="text-xs text-blue-500 hover:underline">🔄 重新抓取</button>
        </div>
        <div id="newsContent"></div>
      </div>

      <!-- Chart -->
      <div class="bg-white rounded-2xl shadow-sm p-4 sm:p-5">
        <h3 class="text-sm font-bold text-slate-600 mb-3">📊 近半年股價走勢圖</h3>
        <div style="height: 280px;">
          <canvas id="priceChart"></canvas>
        </div>
      </div>

      <!-- 互動式每日表格 -->
      <div class="bg-white rounded-2xl shadow-sm p-4 sm:p-5">
        <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
          <h3 class="text-sm font-bold text-slate-600">📋 每天的收盤資料（點任一列可在圖上標示）</h3>
          <div id="rangeBtns" class="flex gap-1 text-xs">
            <button class="range-btn px-3 py-1.5 rounded-lg font-bold bg-blue-500 text-white" data-range="30">近 30 天</button>
            <button class="range-btn px-3 py-1.5 rounded-lg font-bold bg-slate-100 text-slate-600 hover:bg-slate-200" data-range="60">60 天</button>
            <button class="range-btn px-3 py-1.5 rounded-lg font-bold bg-slate-100 text-slate-600 hover:bg-slate-200" data-range="90">90 天</button>
            <button class="range-btn px-3 py-1.5 rounded-lg font-bold bg-slate-100 text-slate-600 hover:bg-slate-200" data-range="all">全部</button>
          </div>
        </div>
        <div class="overflow-auto rounded-lg border border-slate-100" style="max-height: 460px;">
          <table class="w-full text-xs whitespace-nowrap">
            <thead class="sticky top-0 z-10 bg-slate-50 text-slate-600 shadow-sm">
              <tr>
                <th class="px-2.5 py-2 text-left font-bold">日期</th>
                <th class="px-2.5 py-2 text-right font-bold">收盤</th>
                <th class="px-2.5 py-2 text-right font-bold">漲跌</th>
                <th class="px-2.5 py-2 text-right font-bold">%</th>
                <th class="px-2.5 py-2 text-right font-bold">MA5</th>
                <th class="px-2.5 py-2 text-right font-bold">MA20</th>
                <th class="px-2.5 py-2 text-right font-bold">MA60</th>
                <th class="px-2.5 py-2 text-right font-bold">K / D</th>
                <th class="px-2.5 py-2 text-right font-bold">RSI</th>
                <th class="px-2.5 py-2 text-center font-bold">訊號</th>
              </tr>
            </thead>
            <tbody id="dailyTableBody"></tbody>
          </table>
        </div>
        <p class="text-xs text-slate-400 mt-2">
          🔴 漲（台股慣例）／🟢 跌・<span class="font-bold">金叉</span>=短線穿長線往上（好訊號）・<span class="font-bold">死叉</span>=短線穿長線往下（警示）・點任一列圖表上方會標示日期
        </p>
      </div>

      <!-- Indicators -->
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        ${indicatorCard('最新收盤價', fmt(a.close), null)}
        ${indicatorCard('5日均線', fmt(a.ma5), a.close > a.ma5 ? '股價在均線之上 ↑' : '股價在均線之下 ↓')}
        ${indicatorCard('20日均線', fmt(a.ma20), a.close > a.ma20 ? '股價在均線之上 ↑' : '股價在均線之下 ↓')}
        ${indicatorCard('60日均線', fmt(a.ma60), a.close > a.ma60 ? '股價在均線之上 ↑' : '股價在均線之下 ↓')}
        ${indicatorCard('KD 指標', fmt(a.k) + ' / ' + fmt(a.d), a.k > a.d ? '買盤較強 ↑' : '賣盤較強 ↓')}
        ${indicatorCard('RSI(14)', fmt(a.rsi), a.rsi > 70 ? '偏高，注意回跌 ⚠️' : a.rsi < 30 ? '偏低，留意反彈 ⚠️' : '在正常範圍')}
      </div>

      <!-- Reasons -->
      <div class="bg-white rounded-2xl shadow-sm p-4 sm:p-5">
        <h3 class="text-sm font-bold text-slate-600 mb-3">📝 訊號說明（白話版）</h3>
        <ul class="space-y-1.5 text-sm text-slate-700">
          ${a.reasons.map(r => '<li class="flex items-start gap-2"><span class="text-blue-400">•</span><span>' + r + '</span></li>').join('')}
        </ul>
        <p class="text-xs text-slate-400 mt-3 pt-3 border-t border-slate-100">綜合評分：${a.score >= 0 ? '+' : ''}${a.score}（正分越高越偏漲 / 負分越低越偏跌 / 接近 0 代表沒有明確方向）</p>
      </div>
    </div>
  `;

  document.getElementById('emptyState').classList.add('hidden');
  const result = document.getElementById('resultSection');
  result.innerHTML = html;

  // 畫圖（time scale，hover 與日期 100% 對齊）
  if (chartInstance) chartInstance.destroy();
  const ctx = document.getElementById('priceChart').getContext('2d');
  const dates = timestamps.map(t => new Date(t * 1000));
  const toXY = (arr) => arr.map((v, i) => v == null ? null : { x: dates[i], y: v });
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [
        { label: '收盤', data: toXY(closes), borderColor: '#1e40af', backgroundColor: 'rgba(30,64,175,0.05)', fill: true, tension: 0.2, pointRadius: 0, borderWidth: 2, spanGaps: true },
        { label: 'MA5',  data: toXY(a.ma5Arr),  borderColor: '#dc2626', borderWidth: 1.5, pointRadius: 0, fill: false, borderDash: [4,3], spanGaps: true },
        { label: 'MA20', data: toXY(a.ma20Arr), borderColor: '#f59e0b', borderWidth: 1.5, pointRadius: 0, fill: false, borderDash: [4,3], spanGaps: true },
        { label: 'MA60', data: toXY(a.ma60Arr), borderColor: '#10b981', borderWidth: 1.5, pointRadius: 0, fill: false, borderDash: [4,3], spanGaps: true },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false, axis: 'x' },
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 11 }, boxWidth: 14 } },
        tooltip: {
          callbacks: {
            title: (items) => {
              if (!items.length) return '';
              const d = new Date(items[0].parsed.x);
              return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
            },
            label: (ctx) => `${ctx.dataset.label}: ${Number(ctx.parsed.y).toFixed(2)}`
          }
        }
      },
      scales: {
        x: {
          type: 'time',
          time: {
            unit: 'month',
            displayFormats: { month: 'M月', day: 'M/d' },
            tooltipFormat: 'yyyy/M/d'
          },
          ticks: { font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 9 },
          grid: { color: 'rgba(0,0,0,0.04)' }
        },
        y: { ticks: { font: { size: 10 } }, grid: { color: 'rgba(0,0,0,0.04)' } }
      }
    }
  });

  // 互動表格渲染
  const tbody = document.getElementById('dailyTableBody');
  function renderDailyTable(range) {
    const total = closes.length;
    const startIdx = range === 'all' ? 0 : Math.max(0, total - parseInt(range));
    const rows = [];
    for (let i = total - 1; i >= startIdx; i--) {
      const date = new Date(timestamps[i] * 1000);
      const dateStr = `${date.getMonth()+1}/${String(date.getDate()).padStart(2,'0')}`;
      const close = closes[i];
      const prev  = i > 0 ? closes[i - 1] : close;
      const chg = close - prev;
      const chgPct = prev ? (chg / prev) * 100 : 0;
      const ma5  = a.ma5Arr[i],  ma20 = a.ma20Arr[i], ma60 = a.ma60Arr[i];
      const k = a.kArr[i], d = a.dArr[i], rsi = a.rsiArr[i];

      // 訊號徽章
      const badges = [];
      if (i > 0 && ma5 != null && ma20 != null && a.ma5Arr[i-1] != null && a.ma20Arr[i-1] != null) {
        if (a.ma5Arr[i-1] <= a.ma20Arr[i-1] && ma5 > ma20)
          badges.push('<span class="px-1.5 py-0.5 bg-red-500 text-white rounded text-[10px] font-bold">金叉</span>');
        else if (a.ma5Arr[i-1] >= a.ma20Arr[i-1] && ma5 < ma20)
          badges.push('<span class="px-1.5 py-0.5 bg-green-600 text-white rounded text-[10px] font-bold">死叉</span>');
      }
      if (rsi != null && rsi > 70) badges.push('<span class="px-1.5 py-0.5 bg-orange-100 text-orange-700 rounded text-[10px] font-bold">漲過頭</span>');
      else if (rsi != null && rsi < 30) badges.push('<span class="px-1.5 py-0.5 bg-blue-100 text-blue-700 rounded text-[10px] font-bold">跌過頭</span>');
      if (k != null && k > 80 && (rsi == null || rsi <= 70)) badges.push('<span class="px-1.5 py-0.5 bg-orange-50 text-orange-600 rounded text-[10px] font-bold">K高</span>');
      else if (k != null && k < 20 && (rsi == null || rsi >= 30)) badges.push('<span class="px-1.5 py-0.5 bg-blue-50 text-blue-600 rounded text-[10px] font-bold">K低</span>');

      const chgCls = chg > 0 ? 'text-red-600' : chg < 0 ? 'text-green-600' : 'text-slate-400';
      const chgSign = chg > 0 ? '▲' : chg < 0 ? '▼' : '–';
      const isLatest = i === total - 1;
      const baseRowCls = isLatest ? 'bg-yellow-50 font-bold' : 'hover:bg-blue-50';

      const fmt2 = v => v == null ? '<span class="text-slate-300">—</span>' : v.toFixed(2);
      const fmt0 = v => v == null ? '<span class="text-slate-300">—</span>' : v.toFixed(0);

      rows.push(`
        <tr class="row ${baseRowCls} cursor-pointer border-b border-slate-100 transition" data-ts="${timestamps[i]}" data-idx="${i}">
          <td class="px-2.5 py-2 font-mono text-slate-700">${dateStr}${isLatest ? ' <span class="text-[10px] text-yellow-600">(最新)</span>' : ''}</td>
          <td class="px-2.5 py-2 text-right font-bold text-slate-800">${fmt2(close)}</td>
          <td class="px-2.5 py-2 text-right ${chgCls}">${chgSign} ${Math.abs(chg).toFixed(2)}</td>
          <td class="px-2.5 py-2 text-right ${chgCls}">${chgSign} ${Math.abs(chgPct).toFixed(2)}%</td>
          <td class="px-2.5 py-2 text-right text-slate-500">${fmt2(ma5)}</td>
          <td class="px-2.5 py-2 text-right text-slate-500">${fmt2(ma20)}</td>
          <td class="px-2.5 py-2 text-right text-slate-500">${fmt2(ma60)}</td>
          <td class="px-2.5 py-2 text-right text-slate-500">${fmt0(k)} / ${fmt0(d)}</td>
          <td class="px-2.5 py-2 text-right text-slate-500">${fmt0(rsi)}</td>
          <td class="px-2.5 py-2 text-center"><div class="flex flex-wrap gap-1 justify-center">${badges.join('')}</div></td>
        </tr>
      `);
    }
    tbody.innerHTML = rows.join('');

    // 列點擊：圖表畫垂直線
    tbody.querySelectorAll('tr.row').forEach(tr => {
      tr.onclick = () => {
        const ts = parseInt(tr.dataset.ts) * 1000;
        if (chartInstance) {
          chartInstance.options.plugins.verticalLine = { x: ts };
          chartInstance.update('none');
        }
        tbody.querySelectorAll('tr.row').forEach(t => t.classList.remove('ring-2', 'ring-blue-400'));
        tr.classList.add('ring-2', 'ring-blue-400');
      };
    });
  }
  renderDailyTable('30');

  // 區間按鈕
  document.querySelectorAll('#rangeBtns .range-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#rangeBtns .range-btn').forEach(b => {
        b.classList.remove('bg-blue-500', 'text-white');
        b.classList.add('bg-slate-100', 'text-slate-600');
      });
      btn.classList.remove('bg-slate-100', 'text-slate-600');
      btn.classList.add('bg-blue-500', 'text-white');
      renderDailyTable(btn.dataset.range);
    };
  });

  // 抓消息面：以中文股名為主、退而以代號搜尋
  const newsQuery = (name && name !== code) ? name : code;
  renderNewsSection(newsQuery, 'newsContent');
  document.getElementById('refreshNews').onclick = () => renderNewsSection(newsQuery, 'newsContent');

  // 啟動即時報價（如果已設定 Worker）
  startLiveUpdates(code);

  // 按鈕事件
  document.getElementById('pinBtn').onclick = () => {
    togglePin(code);
    renderPins();
    document.getElementById('pinBtn').innerText = isPinned(code) ? '⭐ 已追蹤' : '☆ 追蹤';
  };
  document.getElementById('shareBtn').onclick = async () => {
    const url = location.origin + location.pathname + '?stock=' + code;
    try {
      await navigator.clipboard.writeText(url);
      const btn = document.getElementById('shareBtn');
      const orig = btn.innerText;
      btn.innerText = '✅ 已複製！';
      setTimeout(() => btn.innerText = orig, 1500);
    } catch {
      prompt('複製這個連結分享給朋友：', url);
    }
  };

  // 更新 URL（不重整頁面）
  const newUrl = location.pathname + '?stock=' + code;
  history.replaceState(null, '', newUrl);

  // 上次更新時間
  document.getElementById('lastUpdate').innerText = '上次查詢時間：' + new Date().toLocaleTimeString('zh-TW', { hour12: false });
}

    <div class="text-xs text-slate-500">${label}</div>

    ${hint ? '<div class="text-xs text-slate-400 mt-0.5">' + hint + '</div>' : ''}

}

// ============================================================
function renderPins() {
  const pins = getPins();
  const section = document.getElementById('pinnedSection');

    section.classList.add('hidden');

      <div class="flex items-center justify-between">

        <span class="text-xs text-slate-300">點擊查詢</span>

    </button>
  `).join('');
  grid.querySelectorAll('.pinned-card').forEach(btn => {
    btn.onclick = () => loadStock(btn.dataset.code);

}

// ============================================================
// 本日適合進場：掃描熱門 30 檔
// ============================================================
const SCREEN_LIST = [
  '2330','2317','2454','2308','2382','2891','2412','2881','2882','6505',
  '1303','1301','1216','3711','2884','2885','2890','2887','5880','3045',
  '4904','1101','2603','2609','2615','3034','2379','3008','0050','0056'
];
const SCREEN_CACHE_KEY = 'stock_screen_cache_v1';
const SCREEN_TTL_MS = 60 * 60 * 1000; // 1 小時

async function fetchScreening() {
  const start = new Date();
  start.setMonth(start.getMonth() - 5);
  const startStr = start.toISOString().slice(0, 10);
  const nameMap = await loadNameMap();
  const results = [];

  // 6 檔一批，避免一次打太多
  for (let i = 0; i < SCREEN_LIST.length; i += 6) {
    const batch = SCREEN_LIST.slice(i, i + 6);
    const batchOut = await Promise.all(batch.map(async code => {
      try {
        const url = `${FINMIND_BASE}?dataset=TaiwanStockPrice&data_id=${code}&start_date=${startStr}`;
        const res = await fetch(url);
        const json = await res.json();
        if (!json.data || json.data.length < 60) return null;
        const valid = json.data.filter(r => r.close != null && r.max != null && r.min != null);
        if (valid.length < 60) return null;
        const closes = valid.map(r => r.close);
        const highs  = valid.map(r => r.max);
        const lows   = valid.map(r => r.min);
        const an = analyze(closes, highs, lows);
        const action = getAction(an);
        const last = valid[valid.length - 1];
        const prev = valid[valid.length - 2] || last;
        const chgPct = prev.close ? ((last.close - prev.close) / prev.close) * 100 : 0;
        return { code, name: nameMap[code]?.name || code, close: last.close, chgPct, an, action };
      } catch { return null; }
    }));
    results.push(...batchOut.filter(Boolean));
  }
  return results;
}

async function getScreening(forceRefresh = false) {
  if (!forceRefresh) {
    try {
      const cached = JSON.parse(localStorage.getItem(SCREEN_CACHE_KEY) || 'null');
      if (cached && Date.now() - cached.ts < SCREEN_TTL_MS) return cached.results;
    } catch {}
  }
  const results = await fetchScreening();
  try { localStorage.setItem(SCREEN_CACHE_KEY, JSON.stringify({ ts: Date.now(), results })); } catch {}
  return results;
}

function renderScreening(results) {
  const box = document.getElementById('screenContent');
  // 取「可考慮買進 / 偏向買進」的，依 score 由高到低
  const picks = results
    .filter(r => r.action.tone === 'buy')
    .sort((a, b) => b.an.score - a.an.score);

  if (picks.length === 0) {
    box.innerHTML = `
      <div class="text-center py-4">
        <div class="text-3xl mb-2">😴</div>
        <p class="text-sm text-slate-500 font-bold">收盤後無強烈買進訊號</p>
        <p class="text-xs text-slate-400 mt-1">熱門 30 支股票依收盤價分析，目前都還不在「建議關注買進」的狀態，耐心等等！</p>
      </div>`;
    return;
  }

  const card = (r) => {
    const star = r.action.strong ? '<span class="text-xs font-bold text-yellow-600">★</span>' : '';
    const chgCls = r.chgPct >= 0 ? 'signal-bull' : 'signal-bear';
    const chgSign = r.chgPct >= 0 ? '▲' : '▼';
    return `
      <button class="screen-card text-left bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-xl p-3 transition" data-code="${r.code}">
        <div class="flex items-center justify-between gap-2 mb-1">
          <div class="font-black text-slate-800 text-sm truncate">${r.name}</div>
          ${star}
        </div>
        <div class="font-mono text-xs text-slate-500 mb-1.5">${r.code}</div>
        <div class="flex items-baseline gap-2 mb-1.5">
          <span class="font-black text-slate-800">${r.close.toFixed(2)}</span>
          <span class="text-xs font-bold ${chgCls}">${chgSign} ${Math.abs(r.chgPct).toFixed(2)}%</span>
        </div>
        <div class="text-xs font-bold text-rose-600">${r.action.emoji} ${r.action.tag}</div>
      </button>
    `;
  };

  const cacheTime = (() => {
    try {
      const c = JSON.parse(localStorage.getItem(SCREEN_CACHE_KEY) || 'null');
      if (c) return new Date(c.ts).toLocaleTimeString('zh-TW', { hour12: false });
    } catch {}
    return '';
  })();

  box.innerHTML = `
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2.5 mb-2">
      ${picks.slice(0, 12).map(card).join('')}
    </div>
    <p class="text-xs text-slate-400 text-center pt-1">找到 ${picks.length} 支・掃描時間 ${cacheTime}・點一下看完整分析</p>
  `;

  box.querySelectorAll('.screen-card').forEach(el => {
    el.onclick = () => loadStock(el.dataset.code);
  });
}

async function initScreening(forceRefresh = false) {
  const box = document.getElementById('screenContent');
  if (forceRefresh) {
    box.innerHTML = `<div class="text-sm text-slate-500 text-center py-3"><span class="loader inline-block align-middle mr-2"></span>正在整理熱門 30 支股票的資料…</div>`;
  }
  try {
    const results = await getScreening(forceRefresh);
    renderScreening(results);
  } catch (err) {
    box.innerHTML = `<p class="text-sm text-red-500 text-center py-2">資料載入失敗，請稍後再試一次。</p>`;
  }
}

// ============================================================
// 主流程
// ============================================================
async function loadStock(code) {
  code = String(code).trim().toUpperCase();
  if (!code) return;

  // 清除上一檔股票的即時更新計時器
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }

  const result = document.getElementById('resultSection');
  document.getElementById('emptyState').classList.add('hidden');
  result.innerHTML = `<div class="bg-white rounded-2xl shadow-sm p-8 text-center">
    <div class="loader mx-auto"></div>
    <p class="text-sm text-slate-500 mt-3">正在載入 ${code} 的資料，請稍候…</p>
  </div>`;

  try {
    const [rows, info] = await Promise.all([
      fetchPriceData(code),
      getStockInfo(code).catch(() => ({ name: code, industry: '', type: '' }))
    ]);
    const name = info.name;

    // FinMind 由舊到新（已排序）；過濾掉缺值
    const valid = rows.filter(r => r.close != null && r.max != null && r.min != null && r.open != null);
    if (valid.length < 30) throw new Error('資料不足，無法計算指標（需至少 30 個交易日）');

    const cTs = valid.map(r => Math.floor(new Date(r.date + 'T00:00:00+08:00').getTime() / 1000));
    const cO  = valid.map(r => r.open);
    const cH  = valid.map(r => r.max);
    const cL  = valid.map(r => r.min);
    const cC  = valid.map(r => r.close);
    const cV  = valid.map(r => r.Trading_Volume);

    const last = valid[valid.length - 1];
    const prev = valid[valid.length - 2] || { close: last.close };
    const meta = {
      longName: name,
      industry: info.industry || '',
      market: info.type === 'twse' ? '上市' : info.type === 'tpex' ? '上櫃' : '',
      regularMarketPrice: last.close,
      chartPreviousClose: prev.close,
      previousClose: prev.close,
      lastDate: last.date
    };

    const analysis = analyze(cC, cH, cL);
    renderResult(code, meta, cTs, cO, cH, cL, cC, cV, analysis);
  } catch (err) {
    result.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-center">
      <div class="text-3xl mb-2">😢</div>
      <p class="text-red-700 font-bold">查詢失敗</p>
      <p class="text-sm text-red-600 mt-1">${err.message || '請稍後再試'}</p>
      <p class="text-xs text-slate-500 mt-3">提示：請確認是台股代號（4 位數字），上市與上櫃均支援。若 API 暫時忙碌，稍候再試即可。</p>
    </div>`;
  }
}
